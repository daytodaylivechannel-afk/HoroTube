<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- Техническая информация для браузера -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Заголовок во вкладке -->
    <title>HoroTube</title>
    
    <!-- Подключение иконки и стилей -->
    <!-- ИСПРАВЛЕНО: Относительный путь к иконке -->
    <link rel="icon" href="images/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">

    <style>
        /* Стили для фотографии в левом верхнем углу */
        .top-left-photo {
            position: absolute; /* Картинка привязана к началу страницы */
            top: 0;             
            left: 0;            
            width: 150px;       
            height: auto;       
            z-index: 10;        
        }

        /* Контейнер для кнопки ПОД фотографией слева */
        .button-container {
            position: absolute; 
            top: 60px;         /* Значение из вашего предыдущего кода */
            left: 10px;         
            text-align: left;   
        }

        /* Настройки уменьшенного размера картинки-кнопки */
        .image-button img {
            width: 100%;          
            max-width: 200px;     
            height: auto;         
            display: block;       
            margin: 0;            
            border-radius: 8px;   
            transition: transform 0.2s ease; 
        }

        /* Эффект при наведении курсора */
        .image-button img:hover {
            transform: scale(1.05); 
            cursor: pointer;
        }

        /* НАСТРОЙКИ ТЕКСТА ПОД КНОПКОЙ */
        .button-text {
            margin-top: 10px;        /* Отступ сверху от картинки-кнопки */
            font-family: sans-serif; /* Шрифт без засечек, как у остальных элементов */
            font-size: 14px;         /* Размер шрифта (можно изменить) */
            color: #333333;          /* Цвет текста (темно-серый) */
            max-width: 200px;        /* Чтобы текст не растягивался шире кнопки */
            line-height: 1.4;        /* Расстояние между строками */
        }

        /* Остальные ваши стили для верхних элементов */
        .top-elements {
            display: flex;
            gap: 15px;
            justify-content: flex-start;
            margin-bottom: 15px; 
            margin-left: 170px; 
        }
        .element {
            padding: 10px 20px;
            background-color: #f0f0f0;
            border-radius: 5px;
            font-family: sans-serif;
        }

        /* СТИЛИ ДЛЯ ЭКРАНА БЛОКИРОВКИ ДОСТУПА */
        .access-denied-screen {
            display: none; /* Скрыт по умолчанию */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #f4f7f6;
            z-index: 10000;
            font-family: sans-serif;
        }

        .access-denied-screen h1 {
            color: #dc3545;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .login-redirect-btn {
            padding: 12px 30px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .login-redirect-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <!-- Контейнер блокировки доступа (появляется вместо контента) -->
    <div id="accessDeniedBlock" class="access-denied-screen">
        <h1>Ой, нет доступа!</h1>
        <!-- СОВЕТ: Для GitHub Pages лучше избегать кириллицы в названиях файлов, переименуйте в login.html -->
        <a href="Вход.html" class="login-redirect-btn">Войти</a>
    </div>

   <!-- Основной контент страницы (оборачиваем в контейнер, чтобы легко скрыть) -->
<div id="mainContent">
    <!-- Ваша фотография -->
    <!-- ИСПРАВЛЕНО: Относительный путь вместо локального компьютерного -->
    <img src="images/top-photo.png" alt="Фото" class="top-left-photo">

    <!-- Контейнер слева: кнопка, а под ней текст -->
    <div class="button-container">
        <!-- СОВЕТ: Переименуйте файл без пробелов и кириллицы, например, tour.html -->
        <a href="Тур по Гимназии Хорошколы.html" class="image-button">
            <!-- ИСПРАВЛЕНО: Относительный путь к обложке -->
            <img src="images/maxresdefault.jpg" alt="Обложка тура">
        </a>
        <!-- Текст под кнопкой -->
        <div class="button-text">
            Тур по Гимназии Хорошколы!
        </div>
    </div>
</div>

    <!-- Логика проверки доступа -->
    <script>
        // Читаем переменную из хранилища браузера
        const sist = localStorage.getItem('сист');

        // Если переменная равна "0" или вообще еще не создана
        if (sist === '0' || null === sist) {
            // Скрываем основной контент страницы
            document.getElementById('mainContent').style.display = 'none';
            // Показываем экран ошибки
            document.getElementById('accessDeniedBlock').style.display = 'flex';
        }
    </script>

</body>
</html>
