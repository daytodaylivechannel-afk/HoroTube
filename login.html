<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <style>
        /* Базовые стили для центрирования формы на экране */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Контейнер формы */
        .login-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 22px;
        }

        /* Поле ввода */
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="password"]:focus {
            border-color: #007bff;
            outline: none;
        }

        /* Кнопка */
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* Сообщение об ошибке */
        .error {
            color: #dc3545;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h3>Требуется пароль чтобы войти</h3>
        
        <!-- Форма ввода -->
        <input type="password" id="passwordInput" placeholder="Введите пароль">
        <button onclick="checkPassword()">Вход</button>

        <!-- Сообщение об ошибке -->
        <p id="errorMessage" class="error">Неправильный пароль</p>
    </div>

    <script>
        // Инициализируем переменную значением 0 при загрузке страницы входа
        localStorage.setItem('сист', '0');

        function checkPassword() {
            const password = document.getElementById("passwordInput").value;
            const errorText = document.getElementById("errorMessage");

            if (password === "Srt4h7vbngjk9ivg") { 
                errorText.style.display = "none";
                
                // Меняем значение переменной на 1 перед переходом
                localStorage.setItem('сист', '1');
                
                window.location.href = "Опрос.html"; 
            } else {
                errorText.style.display = "block";
                // Если пароль неверный, возвращаем в 0
                localStorage.setItem('сист', '0');
            }
        }

        // Дополнительно: обработка нажатия Enter для удобства
        document.getElementById("passwordInput").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });
    </script>

</body>
</html>
